<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C99A"/>
      <stop offset="100%" style="stop-color:#075C42"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="28%" r="55%">
      <stop offset="0%" style="stop-color:#4FE0B4" stop-opacity="0.55"/>
      <stop offset="100%" style="stop-color:#4FE0B4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Bold F and T lettermark — matches the in-app/mobile logo mark -->
  <g fill="#FFFFFF">
    <rect x="112" y="112" width="48" height="288" rx="24"/>
    <rect x="112" y="112" width="160" height="48" rx="24"/>
    <rect x="112" y="232" width="128" height="48" rx="24"/>
    <rect x="256" y="112" width="144" height="48" rx="24"/>
    <rect x="304" y="112" width="48" height="288" rx="24"/>
  </g>
</svg>
